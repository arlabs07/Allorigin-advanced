<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="ProxyForge - Advanced CORS proxy with intelligent web processing"><title>ProxyForge - Advanced Web Proxy</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script><script>tailwind.config={theme:{extend:{colors:{dark:{50:'#1a1a1a',100:'#2d2d2d',200:'#404040',300:'#525252',400:'#666666',500:'#808080',600:'#999999',700:'#b3b3b3',800:'#cccccc',900:'#e6e6e6'},accent:{red:'#dc2626',orange:'#ea580c',yellow:'#ca8a04'}},animation:{fadeIn:'fadeIn 0.5s ease-in-out',slideUp:'slideUp 0.3s ease-out',glow:'glow 2s ease-in-out infinite alternate',float:'float 3s ease-in-out infinite'},keyframes:{fadeIn:{from:{opacity:'0',transform:'translateY(20px)'},to:{opacity:'1',transform:'translateY(0)'}},slideUp:{from:{transform:'translateY(100%)',opacity:'0'},to:{transform:'translateY(0)',opacity:'1'}},glow:{'0%':{boxShadow:'0 0 5px #dc2626'},'100%':{boxShadow:'0 0 20px #dc2626, 0 0 30px #dc2626'}},float:{0%,100%:{transform:'translateY(0px)'},50%:{transform:'translateY(-10px)'}}}}}</script><style>body{background:radial-gradient(ellipse at top,#1a1a1a 0%,#2d1b1b 30%,#1a1a1a 70%,#0a0a0a 100%);min-height:100vh;overflow-x:hidden}.glass{background:rgba(45,45,45,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}.glow-red{box-shadow:0 0 20px rgba(220,38,38,0.3);transition:box-shadow 0.3s ease}.glow-red:hover{box-shadow:0 0 30px rgba(220,38,38,0.5)}.text-gradient{background:linear-gradient(45deg,#dc2626,#ea580c,#ca8a04);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.scrollbar-thin{scrollbar-width:thin;scrollbar-color:#dc2626 #2d2d2d}.scrollbar-thin::-webkit-scrollbar{width:6px}.scrollbar-thin::-webkit-scrollbar-track{background:#2d2d2d}.scrollbar-thin::-webkit-scrollbar-thumb{background:#dc2626;border-radius:3px}.custom-input{background:rgba(45,45,45,0.8);border:2px solid rgba(220,38,38,0.3);transition:all 0.3s ease}.custom-input:focus{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,0.1);background:rgba(45,45,45,0.9)}.btn-primary{background:linear-gradient(45deg,#dc2626,#ea580c);position:relative;overflow:hidden;transition:all 0.3s ease}.btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s}.btn-primary:hover::before{left:100%}.status-indicator{position:relative}.status-indicator::after{content:'';position:absolute;top:0;right:0;width:6px;height:6px;border-radius:50%;animation:pulse 2s infinite}.status-success::after{background:#22c55e}.status-error::after{background:#ef4444}.metric-card{background:linear-gradient(135deg,rgba(45,45,45,0.9),rgba(64,64,64,0.7));border-left:4px solid #dc2626;transition:transform 0.2s ease,box-shadow 0.2s ease}.metric-card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(220,38,38,0.2)}.tab-button{position:relative;overflow:hidden}.tab-button::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:#dc2626;transition:width 0.3s ease}.tab-button.active::after{width:100%}.code-container{background:#1e1e1e;border:1px solid rgba(220,38,38,0.3)}.loader{width:40px;height:40px;border:4px solid rgba(220,38,38,0.3);border-top:4px solid #dc2626;border-radius:50%;animation:spin 1s linear infinite}@media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}</style></head><body class="text-gray-100 font-sans antialiased"><div id="background" class="fixed inset-0 overflow-hidden pointer-events-none"><div class="absolute top-1/4 left-1/4 w-96 h-96 bg-accent-red opacity-10 rounded-full filter blur-3xl animate-float"></div><div class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-accent-orange opacity-10 rounded-full filter blur-3xl animate-float" style="animation-delay:1s"></div></div><main class="relative z-10 min-h-screen"><header class="container mx-auto px-4 py-6"><div class="glass rounded-2xl p-6 text-center animate-fadeIn"><div class="flex items-center justify-center gap-4 mb-4"><i class="fas fa-fire text-4xl text-gradient animate-glow"></i><h1 class="text-5xl font-black text-gradient">ProxyForge</h1></div><p class="text-gray-300 text-lg">Advanced Web Proxy with Intelligent Processing & Real-time Analysis</p><div class="flex flex-wrap justify-center gap-4 mt-6 text-sm"><span class="glass px-3 py-1 rounded-full flex items-center gap-2"><i class="fas fa-shield-alt text-accent-red"></i>Security Bypass</span><span class="glass px-3 py-1 rounded-full flex items-center gap-2"><i class="fas fa-link text-accent-orange"></i>Link Processing</span><span class="glass px-3 py-1 rounded-full flex items-center gap-2"><i class="fas fa-chart-line text-accent-yellow"></i>Real-time Analytics</span><span class="glass px-3 py-1 rounded-full flex items-center gap-2"><i class="fas fa-bolt text-accent-red"></i>High Performance</span></div></div></header><section class="container mx-auto px-4 pb-8"><div class="glass rounded-2xl p-6 animate-fadeIn"><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2"><div class="mb-6"><label for="urlInput" class="block text-sm font-semibold mb-3 text-gray-200"><i class="fas fa-globe mr-2"></i>Target URL</label><div class="relative"><input type="url" id="urlInput" placeholder="https://example.com" class="w-full px-4 py-3 pl-12 custom-input rounded-lg text-white placeholder-gray-400 focus:outline-none" autocomplete="url" spellcheck="false"><i class="fas fa-link absolute left-4 top-1/2 transform -translate-y-1/2 text-accent-red"></i></div></div><div class="mb-6"><label class="block text-sm font-semibold mb-3 text-gray-200"><i class="fas fa-rocket mr-2"></i>Quick Test</label><div id="examples" class="flex flex-wrap gap-2"></div></div><div class="flex flex-wrap gap-3"><button id="processBtn" class="btn-primary px-6 py-3 rounded-lg font-semibold text-white flex items-center gap-2 glow-red"><i class="fas fa-cogs"></i><span>Process URL</span></button><button id="clearBtn" class="glass px-6 py-3 rounded-lg font-semibold text-gray-300 hover:text-white transition-colors flex items-center gap-2"><i class="fas fa-trash"></i><span>Clear</span></button></div></div><div class="lg:col-span-1"><div class="glass rounded-xl p-4"><h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-info-circle text-accent-red"></i>Processing Status</h3><div id="statusPanel" class="space-y-3"><div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-gray-600"></div><span class="text-sm text-gray-400">Ready to process</span></div></div></div></div></div></div></section><div id="loadingPanel" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"><div class="glass rounded-2xl p-8 text-center max-w-md mx-4"><div class="loader mx-auto mb-4"></div><h3 class="text-xl font-bold mb-2">Processing Request</h3><p class="text-gray-400" id="loadingText">Fetching webpage...</p><div class="mt-4 bg-gray-800 rounded-full h-2 overflow-hidden"><div id="progressBar" class="h-full bg-gradient-to-r from-accent-red to-accent-orange transition-all duration-300" style="width:0%"></div></div></div></div><section id="results" class="hidden container mx-auto px-4 pb-8"><div class="glass rounded-2xl p-6 animate-slideUp"><div class="flex items-center justify-between mb-6"><h2 class="text-2xl font-bold flex items-center gap-3"><i class="fas fa-chart-bar text-accent-red"></i>Analysis Results</h2><div id="resultStatus" class="status-indicator glass px-4 py-2 rounded-full"></div></div><div id="metricsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div><div class="flex flex-wrap gap-2 mb-6 border-b border-gray-700"><button class="tab-button px-6 py-3 font-semibold transition-colors hover:text-white active" data-tab="overview"><i class="fas fa-tachometer-alt mr-2"></i>Overview</button><button class="tab-button px-6 py-3 font-semibold transition-colors hover:text-white" data-tab="metadata"><i class="fas fa-tags mr-2"></i>Metadata</button><button class="tab-button px-6 py-3 font-semibold transition-colors hover:text-white" data-tab="analysis"><i class="fas fa-search mr-2"></i>Analysis</button><button class="tab-button px-6 py-3 font-semibold transition-colors hover:text-white" data-tab="html"><i class="fas fa-code mr-2"></i>HTML</button><button class="tab-button px-6 py-3 font-semibold transition-colors hover:text-white" data-tab="preview"><i class="fas fa-eye mr-2"></i>Preview</button></div><div id="tabContent" class="space-y-6"></div></div></section></main><footer class="container mx-auto px-4 py-8"><div class="glass rounded-2xl p-6 text-center"><div class="flex flex-wrap justify-center items-center gap-6 text-sm text-gray-400"><span class="flex items-center gap-2"><i class="fas fa-code text-accent-red"></i>ProxyForge v2.0</span><span class="flex items-center gap-2"><i class="fas fa-server text-accent-orange"></i>High Performance</span><span class="flex items-center gap-2"><i class="fas fa-shield-alt text-accent-yellow"></i>Secure Processing</span></div></div></footer><script>const examples=[{name:'GitHub',url:'https://github.com',icon:'fab fa-github'},{name:'MDN Docs',url:'https://developer.mozilla.org',icon:'fas fa-book'},{name:'Stack Overflow',url:'https://stackoverflow.com',icon:'fab fa-stack-overflow'},{name:'W3Schools',url:'https://www.w3schools.com',icon:'fas fa-graduation-cap'},{name:'NPM',url:'https://npmjs.com',icon:'fab fa-npm'},{name:'Bootstrap',url:'https://getbootstrap.com',icon:'fab fa-bootstrap'}];let currentData=null,progressInterval;function initializeExamples(){const container=document.getElementById('examples');examples.forEach(example=>{const btn=document.createElement('button');btn.className='glass px-4 py-2 rounded-lg text-sm font-medium hover:glow-red transition-all flex items-center gap-2';btn.innerHTML=`<i class="${example.icon} text-accent-red"></i>${example.name}`;btn.onclick=()=>setUrl(example.url);container.appendChild(btn)})}function setUrl(url){document.getElementById('urlInput').value=url;document.getElementById('urlInput').focus()}function updateStatus(text,type='info'){const panel=document.getElementById('statusPanel');const icons={info:'fas fa-info-circle',success:'fas fa-check-circle',error:'fas fa-exclamation-circle',processing:'fas fa-spinner fa-spin'};const colors={info:'bg-blue-600',success:'bg-green-600',error:'bg-red-600',processing:'bg-yellow-600'};panel.innerHTML=`<div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full ${colors[type]}"></div><span class="text-sm">${text}</span></div>`}function showLoading(show=true){const panel=document.getElementById('loadingPanel');if(show){panel.classList.remove('hidden');let progress=0;progressInterval=setInterval(()=>{progress=Math.min(progress+Math.random()*15,90);document.getElementById('progressBar').style.width=progress+'%'},200)}else{panel.classList.add('hidden');clearInterval(progressInterval);document.getElementById('progressBar').style.width='0%'}}function createMetricCard(icon,label,value,color='accent-red'){return`<div class="metric-card rounded-xl p-4"><div class="flex items-center justify-between mb-2"><i class="${icon} text-${color}"></i><span class="text-2xl font-bold">${value}</span></div><p class="text-sm text-gray-400">${label}</p></div>`}function showResults(data){currentData=data;document.getElementById('results').classList.remove('hidden');const status=document.getElementById('resultStatus');if(data.success){status.innerHTML='<i class="fas fa-check text-green-400 mr-2"></i>Success';status.className+=' status-success'}else{status.innerHTML='<i class="fas fa-times text-red-400 mr-2"></i>Error';status.className+=' status-error'}if(data.success){const metrics=document.getElementById('metricsGrid');metrics.innerHTML=[createMetricCard('fas fa-clock','Response Time',data.responseTime+'ms','accent-orange'),createMetricCard('fas fa-database','Original Size',(data.size.original/1024).toFixed(1)+'KB','accent-yellow'),createMetricCard('fas fa-compress','Processed Size',(data.size.processed/1024).toFixed(1)+'KB','accent-red'),createMetricCard('fas fa-link','Total Links',data.analysis.totalLinks,'accent-orange'),createMetricCard('fas fa-images','Images',data.analysis.images,'accent-yellow'),createMetricCard('fas fa-file-code','Scripts',data.analysis.scripts,'accent-red')].join('')}showTab('overview')}function showTab(tabName){document.querySelectorAll('.tab-button').forEach(btn=>{btn.classList.remove('active');if(btn.dataset.tab===tabName)btn.classList.add('active')});const content=document.getElementById('tabContent');const data=currentData;if(!data)return;switch(tabName){case'overview':content.innerHTML=`<div class="grid lg:grid-cols-2 gap-6"><div class="glass rounded-xl p-6"><h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-info text-accent-red"></i>Request Info</h3><div class="space-y-3 text-sm">${[`<div class="flex justify-between"><span class="text-gray-400">URL:</span><span class="font-mono break-all">${data.url}</span></div>`,`<div class="flex justify-between"><span class="text-gray-400">Status:</span><span class="${data.status<400?'text-green-400':'text-red-400'}">${data.status} ${data.statusText}</span></div>`,`<div class="flex justify-between"><span class="text-gray-400">Content-Type:</span><span>${data.contentType}</span></div>`,`<div class="flex justify-between"><span class="text-gray-400">Response Time:</span><span class="text-accent-orange">${data.responseTime}ms</span></div>`,`<div class="flex justify-between"><span class="text-gray-400">Timestamp:</span><span>${new Date(data.timestamp).toLocaleString()}</span></div>`].join('')}</div></div><div class="glass rounded-xl p-6"><h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-cogs text-accent-orange"></i>Processing</h3><div class="space-y-3">${[`<div class="flex items-center gap-3"><i class="fas fa-${data.processedLinks?'check text-green-400':'times text-red-400'}"></i><span>Links Processed</span></div>`,`<div class="flex items-center gap-3"><i class="fas fa-${data.securityRemoved?'check text-green-400':'times text-red-400'}"></i><span>Security Removed</span></div>`,`<div class="flex justify-between"><span>Compression:</span><span class="text-accent-red">${data.size.compression}</span></div>`].join('')}</div></div></div>`;break;case'metadata':if(data.success){content.innerHTML=`<div class="glass rounded-xl p-6"><h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-tags text-accent-red"></i>Page Metadata</h3><div class="grid md:grid-cols-2 gap-4 text-sm">${Object.entries(data.metadata).map(([key,value])=>`<div class="border-l-4 border-accent-red pl-4"><div class="text-gray-400 text-xs uppercase">${key}</div><div class="font-semibold ${value?'text-white':'text-gray-500'}">${value||'N/A'}</div></div>`).join('')}</div></div>`}else{content.innerHTML='<div class="glass rounded-xl p-6 text-center text-gray-400">No metadata available</div>'}break;case'analysis':if(data.success){const headings=Object.entries(data.analysis.headings).map(([tag,count])=>`${tag.toUpperCase()}: ${count}`).join(' | ');content.innerHTML=`<div class="grid md:grid-cols-2 gap-6"><div class="glass rounded-xl p-6"><h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-chart-pie text-accent-red"></i>Content Analysis</h3><div class="space-y-4">${[`<div class="flex justify-between items-center"><span>Total Links:</span><span class="font-bold text-accent-red">${data.analysis.totalLinks}</span></div>`,`<div class="flex justify-between items-center"><span>Internal Links:</span><span class="font-bold text-green-400">${data.analysis.internalLinks}</span></div>`,`<div class="flex justify-between items-center"><span>External Links:</span><span class="font-bold text-yellow-400">${data.analysis.externalLinks}</span></div>`,`<div class="flex justify-between items-center"><span>Images:</span><span class="font-bold text-blue-400">${data.analysis.images}</span></div>`,`<div class="flex justify-between items-center"><span>Scripts:</span><span class="font-bold text-purple-400">${data.analysis.scripts}</span></div>`,`<div class="flex justify-between items-center"><span>Stylesheets:</span><span class="font-bold text-pink-400">${data.analysis.stylesheets}</span></div>`].join('')}</div></div><div class="glass rounded-xl p-6"><h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-file-alt text-accent-orange"></i>Page Features</h3><div class="space-y-4">${[`<div class="flex items-center gap-3"><i class="fas fa-${data.analysis.hasForm?'check text-green-400':'times text-red-400'}"></i><span>Contains Forms</span></div>`,`<div class="flex items-center gap-3"><i class="fas fa-${data.analysis.hasVideo?'check text-green-400':'times text-red-400'}"></i><span>Contains Video</span></div>`,`<div class="flex items-center gap-3"><i class="fas fa-${data.analysis.hasAudio?'check text-green-400':'times text-red-400'}"></i><span>Contains Audio</span></div>`,`<div class="border-t border-gray-600 pt-4 mt-4"><div class="text-sm text-gray-400 mb-2">Text Length</div><div class="font-bold">${data.analysis.textLength.toLocaleString()} characters</div></div>`,`<div class="border-t border-gray-600 pt-4 mt-4"><div class="text-sm text-gray-400 mb-2">Headings</div><div class="text-sm font-mono">${headings}</div></div>`].join('')}</div></div></div>`}else{content.innerHTML='<div class="glass rounded-xl p-6 text-center text-gray-400">No analysis data available</div>'}break;case'html':if(data.success){content.innerHTML=`<div class="glass rounded-xl p-4"><div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-code text-accent-red"></i>Processed HTML</h3><button onclick="copyToClipboard(currentData.contents)" class="glass px-4 py-2 rounded-lg text-sm hover:glow-red transition-all flex items-center gap-2"><i class="fas fa-copy"></i>Copy</button></div><div class="code-container rounded-lg p-4 max-h-96 overflow-auto scrollbar-thin"><pre><code class="language-html text-sm">${escapeHtml(data.contents)}</code></pre></div></div>`;hljs.highlightAll()}else{content.innerHTML='<div class="glass rounded-xl p-6 text-center text-gray-400">No HTML content available</div>'}break;case'preview':if(data.success){content.innerHTML=`<div class="glass rounded-xl p-4"><h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fas fa-eye text-accent-red"></i>Live Preview</h3><div class="bg-white rounded-lg overflow-hidden" style="height:600px"><iframe id="previewFrame" class="w-full h-full border-0" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals" loading="lazy"></iframe></div></div>`;const iframe=document.getElementById('previewFrame');const blob=new Blob([data.contents],{type:'text/html'});iframe.src=URL.createObjectURL(blob)}else{content.innerHTML='<div class="glass rounded-xl p-6 text-center text-gray-400">No preview available</div>'}break}}function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}function copyToClipboard(text){navigator.clipboard.writeText(text).then(()=>{const btn=event.target.closest('button');const originalText=btn.innerHTML;btn.innerHTML='<i class="fas fa-check"></i>Copied!';btn.classList.add('text-green-400');setTimeout(()=>{btn.innerHTML=originalText;btn.classList.remove('text-green-400')},2000)}).catch(()=>{alert('Failed to copy to clipboard')})}async function processUrl(){const urlInput=document.getElementById('urlInput');const url=urlInput.value.trim();if(!url){updateStatus('Please enter a valid URL','error');return}if(!/^https?:\/\/.+/.test(url)){updateStatus('URL must start with http:// or https://','error');return}updateStatus('Processing request...','processing');showLoading(true);document.getElementById('processBtn').disabled=true;try{const startTime=Date.now();const response=await fetch(`/api/proxy?url=${encodeURIComponent(url)}`);const data=await response.json();const endTime=Date.now();showLoading(false);document.getElementById('processBtn').disabled=false;if(data.success){updateStatus('Processing completed successfully','success');showResults(data);document.getElementById('results').scrollIntoView({behavior:'smooth'})}else{updateStatus(`Error: ${data.error}`,'error');showResults(data)}}catch(error){showLoading(false);document.getElementById('processBtn').disabled=false;updateStatus(`Network error: ${error.message}`,'error');console.error('Error:',error)}}function clearResults(){document.getElementById('results').classList.add('hidden');document.getElementById('urlInput').value='';currentData=null;updateStatus('Ready to process','info')}document.getElementById('urlInput').addEventListener('keypress',e=>{if(e.key==='Enter')processUrl()});document.getElementById('processBtn').addEventListener('click',processUrl);document.getElementById('clearBtn').addEventListener('click',clearResults);document.querySelectorAll('.tab-button').forEach(btn=>{btn.addEventListener('click',()=>showTab(btn.dataset.tab))});window.addEventListener('load',()=>{initializeExamples();updateStatus('Ready to process','info')});</script></body></html>
